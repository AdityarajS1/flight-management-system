apiVersion: v1
kind: Secret
metadata:
  name: flight-management-secrets
type: Opaque
stringData:
  DB_URL: "jdbc:mysql://mysql.example.svc.cluster.local:3306/flight_management"
  DB_USERNAME: "replace-me"
  DB_PASSWORD: "replace-me"
  JWT_SECRET: "replace-with-a-random-secret-at-least-32-characters"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "replace-with-a-unique-password-at-least-12-chars"
