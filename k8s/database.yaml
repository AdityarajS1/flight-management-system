apiVersion: v1
kind: Service
metadata:
  name: flight-management-db
  labels:
    app: flight-management-db
spec:
  clusterIP: None
  selector:
    app: flight-management-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flight-management-db
  labels:
    app: flight-management-db
spec:
  serviceName: flight-management-db
  replicas: 1
  selector:
    matchLabels:
      app: flight-management-db
  template:
    metadata:
      labels:
        app: flight-management-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_DATABASE
              value: flight_management
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: flight-management-secrets
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flight-management-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flight-management-secrets
                  key: DB_ROOT_PASSWORD
          startupProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - --host=127.0.0.1
                - --silent
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
