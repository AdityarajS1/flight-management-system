apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-management
  labels:
    app: flight-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-management
  template:
    metadata:
      labels:
        app: flight-management
    spec:
      containers:
        - name: flight-management
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flight-management-config
            - secretRef:
                name: flight-management-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
