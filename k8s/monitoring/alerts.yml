groups:
  - name: flight-management
    rules:
      - alert: FlightManagementDown
        expr: up{job="flight-management"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Flight Management application is unavailable
          description: Prometheus cannot scrape the application metrics endpoint.

      - alert: FlightManagementHighResponseTime
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="flight-management",uri!~"/actuator.*"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Flight Management response time is elevated
          description: The 5-minute p95 HTTP response time has exceeded 2 seconds.
